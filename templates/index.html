
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Python + MongoDB</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 40px;
        }

        .container {
            background: white;
            padding: 25px;
            max-width: 500px;
            margin: auto;
            border-radius: 10px;
        }

        input, select, button {
            padding: 10px;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background: #198754;
            color: white;
            border: none;
            cursor: pointer;
        }

        .delete-btn {
            background: #dc3545;
            width: auto;
            margin-left: 10px;
            padding: 6px 12px;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Management</h1>

    <h3>Add a student</h3>

    <form action="/add" method="POST">
        <input type="text" name="name"
               placeholder="Student name" required>

        <input type="number" name="age"
               placeholder="Student age" required>

        <button type="submit">Add Student</button>
    </form>

    <h3>Search students</h3>

    <form action="/" method="GET">
        <input type="text" name="q"
               placeholder="Search by name" value="{{ q }}">

        <select name="age_range">
            <option value="">All ages</option>
            <option value="1-10" {% if age_range == '1-10' %}selected{% endif %}>1 - 10</option>
            <option value="10-18" {% if age_range == '10-18' %}selected{% endif %}>10 - 18</option>
            <option value="18-25" {% if age_range == '18-25' %}selected{% endif %}>18 - 25</option>
            <option value="25-100" {% if age_range == '25-100' %}selected{% endif %}>25 +</option>
        </select>

        <button type="submit">Search</button>
    </form>

    <h3>Students List</h3>

    <ul>
        {% for student in students %}
            <li>
                <span>{{ student.name }} - {{ student.age }} years old</span>
                <form action="{{ url_for('delete_student', student_id=student._id) }}" method="POST" style="margin: 0;">
                    <button class="delete-btn" type="submit">Supprimer</button>
                </form>
            </li>
        {% else %}
            <li>No students found.</li>
        {% endfor %}
    </ul>

</div>

</body>
</html>
